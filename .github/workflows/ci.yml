name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@daaa84171772acc22bb3e6ea0e555b4e86436ffc # v0.6.100
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      fetch-depth: 0
      tools: shellcheck@0.11.0,zizmor@1.32.0
      tool-assets: .github/ci-tools.json
